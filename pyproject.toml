[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iceberg-vector-loader"
version = "0.1.0"
description = "Load fvecs / parquet embeddings into a Spark-native Iceberg v3 table, or convert fvecs / ivecs / parquet to Lance."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyarrow>=17",
    "numpy>=1.26",
    "click>=8.1",
    "pylance>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iceberg-vector-loader = "iceberg_vector_loader.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
